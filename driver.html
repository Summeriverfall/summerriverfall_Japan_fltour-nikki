<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>運転日報 · 司机</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #C9A961; --cream: #FAF8F3; --card: #fff; --border: #E8E5DF;
      --dark: #2C2C2C; --mid: #4A4A4A; --light: #7A7A7A; --ok: #1E8E4F; --danger: #DC3545;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: var(--cream); color: var(--dark); font-family: 'Noto Sans SC','Noto Sans JP',sans-serif; }
    body { min-height: 100dvh; padding: 0 0 6.5rem; }
    .top {
      position: sticky; top: 0; z-index: 20;
      background: var(--card); border-bottom: 1px solid var(--border);
      padding: .85rem 1rem .75rem; padding-top: max(.85rem, env(safe-area-inset-top));
    }
    .brand { font-size: .72rem; letter-spacing: .12em; color: var(--gold); font-weight: 700; }
    .top h1 { font-size: 1.15rem; font-weight: 700; margin-top: .15rem; }
    .sub { font-size: .78rem; color: var(--light); margin-top: .15rem; }
    .wrap { padding: .9rem 1rem 1.5rem; max-width: 520px; margin: 0 auto; }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 14px;
      padding: 1rem; margin-bottom: .75rem;
    }
    .card h2 {
      font-size: .72rem; font-weight: 700; color: var(--light);
      letter-spacing: .06em; text-transform: uppercase; margin-bottom: .75rem;
    }
    label { display: block; font-size: .82rem; font-weight: 600; color: var(--mid); margin: .55rem 0 .28rem; }
    label .jp { font-weight: 400; color: var(--light); margin-left: .25rem; font-size: .75rem; }
    input, select, textarea {
      width: 100%; font-size: 16px; font-family: inherit;
      padding: .78rem .8rem; border: 1.5px solid var(--border); border-radius: 10px;
      background: var(--cream); color: var(--dark); appearance: none;
    }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--gold); background: #fff; }
    textarea { min-height: 4.2rem; resize: vertical; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: .55rem; }
    .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: .45rem; }
    .hint { font-size: .75rem; color: var(--light); margin-top: .4rem; }
    .km { font-size: 1.05rem; font-weight: 700; padding: .6rem 0 .2rem; }
    .km span { color: var(--gold); }
    .trip {
      border: 1px solid var(--border); border-radius: 12px; padding: .75rem; margin-bottom: .55rem; background: #fff;
    }
    .trip-h { display: flex; justify-content: space-between; align-items: center; margin-bottom: .35rem; }
    .trip-h b { font-size: .85rem; }
    .ghost {
      background: none; border: 1px solid var(--border); color: var(--mid);
      border-radius: 8px; padding: .28rem .55rem; font-size: .75rem; cursor: pointer;
    }
    .add {
      width: 100%; padding: .75rem; border: 1.5px dashed var(--gold); background: rgba(201,169,97,.08);
      color: #8a6d28; border-radius: 10px; font-weight: 600; font-size: .9rem; cursor: pointer;
    }
    .foot {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
      background: var(--card); border-top: 1px solid var(--border);
      padding: .7rem 1rem calc(.7rem + env(safe-area-inset-bottom));
    }
    .btn {
      width: 100%; max-width: 520px; margin: 0 auto; display: block;
      background: var(--dark); color: #fff; border: 0; border-radius: 12px;
      padding: .95rem 1rem; font-size: 1rem; font-weight: 700; cursor: pointer;
    }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .btn.ok { background: var(--ok); }
    .toast {
      display: none; position: fixed; left: 50%; bottom: 6.2rem; transform: translateX(-50%);
      background: var(--dark); color: #fff; padding: .55rem 1rem; border-radius: 999px; font-size: .82rem; z-index: 40;
    }
    .lock {
      background: #eef7f1; border: 1px solid #cde8d6; color: #1E8E4F;
      border-radius: 10px; padding: .7rem .85rem; font-size: .82rem; margin-bottom: .75rem;
    }
    .who { display: flex; gap: .85rem; align-items: center; margin-top: .55rem; }
    .who a { font-size: .78rem; color: var(--gold); text-decoration: none; }
    .err { color: var(--danger); font-size: .82rem; margin-top: .55rem; min-height: 1.1em; }
    .save-line { font-size: .72rem; color: var(--ok); margin-top: .12rem; min-height: 1em; }
    .save-line.warn { color: #b8860b; }
    .test-hint { margin-top: .35rem; color: #c9c4bb; font-size: .75rem; font-weight: 400; line-height: 1.65; }
    .test-hint p { margin: 0 0 .35rem; }
    .test-row {
      display: flex; justify-content: space-between; align-items: center; gap: .5rem;
      padding: .08rem 0; cursor: pointer; color: inherit;
    }
    .test-row b { font-weight: 400; white-space: nowrap; }
    .test-row code { font-family: inherit; font-size: inherit; color: inherit; user-select: all; }
  </style>
</head>
<body>
  <header class="top">
    <div class="brand">FLTOUR エフアイ</div>
    <h1>運転日報</h1>
    <p class="sub" id="whoLine">一人一天一份 · 当晚提交</p>
    <p class="save-line" id="saveLine"></p>
    <div class="who">
      <a href="index.html" id="backHome">返回入口</a>
      <a href="#" id="switchDriver">退出登录</a>
    </div>
  </header>
  <main class="wrap" id="app"></main>
  <div class="foot"><button class="btn" id="submitBtn" type="button">确认提交给公司</button></div>
  <div class="toast" id="toast"></div>
  <script src="app.js?v=20261016"></script>
  <script>
    const SHOW_TEST_PLATES = true; // 正式版改 false，或整块删掉
    const $app = document.getElementById('app');
    const $btn = document.getElementById('submitBtn');
    const $foot = document.querySelector('.foot');
    const $toast = document.getElementById('toast');
    const $save = document.getElementById('saveLine');
    let state = Nikki.load();
    let driverId = sessionStorage.getItem('nikki-driver') || '';
    let report = null;

    Nikki.onSaveStatus = (t) => {
      $save.textContent = t || '';
      $save.classList.toggle('warn', /未连|失败/.test(t || ''));
    };

    function toast(t) {
      $toast.textContent = t; $toast.style.display = 'block';
      setTimeout(() => { $toast.style.display = 'none'; }, 1800);
    }
    function alreadySent() { return report && report.status === 'submitted'; }

    function sel(name, val, opts, extra = '') {
      const o = [`<option value="">请选择</option>`]
        .concat(opts.map(([v, l]) => `<option value="${v}" ${v === val ? 'selected' : ''}>${l}</option>`));
      return `<select name="${name}" ${extra}>${o.join('')}</select>`;
    }
    function hm(hName, mName, h, m) {
      const hs = Nikki.hours().map((x) => [x, x]);
      const ms = Nikki.mins().map((x) => [x, x]);
      return `<div class="row2">${sel(hName, h, hs)} ${sel(mName, m, ms)}</div>`;
    }
    function timeSel(name, val) {
      const opts = [];
      Nikki.hours().forEach((h) => Nikki.mins().forEach((m) => {
        const t = h + ':' + m; opts.push([t, t]);
      }));
      return sel(name, val, opts);
    }

    function switchDriver(e) {
      if (e) e.preventDefault();
      Nikki.flush();
      Nikki.logout();
      driverId = '';
      report = null;
      document.getElementById('whoLine').textContent = '一人一天一份 · 当晚提交';
      $save.textContent = '';
      renderLogin();
    }
    document.getElementById('switchDriver').onclick = switchDriver;
    document.getElementById('backHome').onclick = () => {
      persist();
      Nikki.flush();
    };

    async function renderLogin() {
      $btn.style.display = 'none';
      if ($foot) $foot.style.display = 'none';
      document.getElementById('switchDriver').style.display = 'none';
      const drivers = await Nikki.publicDrivers();
      const opts = drivers.map((d) => [d.id, d.name]);
      const testHtml = SHOW_TEST_PLATES ? `
        <div class="test-hint">
          <p>测试用 · 点一行复制番号（正式版删除）</p>
          ${Nikki.testRoster().map((x) => `
            <div class="test-row" data-id="${x.id}" data-plate="${x.plate}">
              <b>${x.name}</b><code>${x.plate}</code>
            </div>`).join('')}
        </div>` : '';
      $app.innerHTML = `
        <div class="card">
          <h2>登录</h2>
          <label>乘务员 <span class="jp">乗務員名</span></label>
          ${sel('me', '', opts)}
          <label>车辆番号（密码） <span class="jp">自動車登録番号</span></label>
          <input name="plate" type="password" autocomplete="current-password" placeholder="请输入自己的车牌号">
          <p class="err" id="loginErr"></p>
          <button class="btn" type="button" id="loginBtn" style="margin-top:.4rem">登录</button>
          <p class="hint">选好名字，用车牌号当密码。填过的会马上保存，关掉再打开还能接着填。提交后也可以继续改。</p>
        </div>
        ${testHtml}`;
      const doLogin = async () => {
        const id = $app.querySelector('[name=me]').value;
        const plate = $app.querySelector('[name=plate]').value;
        const err = document.getElementById('loginErr');
        err.textContent = '';
        if (!id) { err.textContent = '请选择乘务员'; return; }
        if (!plate) { err.textContent = '请输入车辆番号'; return; }
        try {
          state = await Nikki.loginDriver(id, plate);
          driverId = id;
          report = Nikki.ensureToday(state, driverId);
          render();
        } catch (e) {
          err.textContent = e.message || '登录失败';
        }
      };
      $app.querySelector('#loginBtn').onclick = doLogin;
      $app.querySelector('[name=plate]').onkeydown = (e) => {
        if (e.key === 'Enter') doLogin();
      };
      $app.querySelectorAll('.test-row').forEach((row) => {
        row.onclick = async () => {
          const id = row.dataset.id;
          const plate = row.dataset.plate || '';
          $app.querySelector('[name=me]').value = id;
          $app.querySelector('[name=plate]').value = plate;
          try { await navigator.clipboard.writeText(plate); } catch (_) {}
          toast('已复制 ' + plate);
        };
      });
    }

    function tripHtml(t, i) {
      const pax = Nikki.paxOptions().map((x) => [x, x + '人']);
      return `<div class="trip" data-i="${i}">
        <div class="trip-h"><b>第 ${i + 1} 趟</b>
          <button class="ghost" type="button" data-del="${i}">删除</button>
        </div>
        <label>出发时间 <span class="jp">出発時間</span></label>
        ${timeSel('depart-' + i, t.depart)}
        <label>上车地点 <span class="jp">乗車場所</span></label>
        <input name="pickup-${i}" value="${t.pickup || ''}" placeholder="例：なんば">
        <label>人数 <span class="jp">乗車人数（大人+小孩合计）</span></label>
        ${sel('pax-' + i, t.pax, pax)}
        <label>到达地点 <span class="jp">到着場所</span></label>
        <input name="dropoff-${i}" value="${t.dropoff || ''}" placeholder="例：関西空港">
        <label>到达时间 <span class="jp">到着時間</span></label>
        ${timeSel('arrive-' + i, t.arrive)}
        <label>空车/等待（分钟） <span class="jp">空車・待機時間</span></label>
        <input name="wait-${i}" inputmode="numeric" value="${t.wait || ''}" placeholder="分钟">
      </div>`;
    }

    function render() {
      if (!driverId) return renderLogin();
      document.getElementById('switchDriver').style.display = '';
      $btn.style.display = 'block';
      if ($foot) $foot.style.display = '';
      const name = Nikki.driverName(state, driverId);
      document.getElementById('whoLine').textContent = name + ' · ' + report.date + ' · 一人一天一份';
      const dOpts = state.drivers.map((d) => [d.id, d.name]);
      const vOpts = state.vehicles.map((v) => [v.id, v.plate]);
      const dist = Nikki.distanceKm(report);
      $app.innerHTML = `
        ${alreadySent() ? `<div class="lock">今天已交过一版，还可以继续改、继续加行程，再点下面更新。</div>` : ''}
        <div class="card">
          <h2>基本</h2>
          <label>日期 <span class="jp">日付</span></label>
          <input type="date" name="date" value="${report.date}">
          <label>乘务员 <span class="jp">乗務員名</span></label>
          ${sel('driverId', report.driverId, dOpts)}
          <label>车辆番号 <span class="jp">自動車登録番号</span></label>
          ${sel('vehicleId', report.vehicleId, vOpts)}
        </div>
        <div class="card">
          <h2>出库 / 回库</h2>
          <label>出库地点 <span class="jp">乗務開始地点</span></label>
          <input name="startPlace" value="${report.startPlace || '車庫'}">
          <label>出库时间 <span class="jp">24時間</span></label>
          ${hm('startHour', 'startMin', report.startHour, report.startMin)}
          <label>回库地点 <span class="jp">乗務終了地点</span></label>
          <input name="endPlace" value="${report.endPlace || '車庫'}">
          <label>回库时间</label>
          ${hm('endHour', 'endMin', report.endHour, report.endMin)}
        </div>
        <div class="card">
          <h2>公里数 ※空车距离必填</h2>
          <label>开始码表 <span class="jp">乗務開始メーター km</span></label>
          <input name="meterStart" inputmode="decimal" value="${report.meterStart || ''}">
          <label>结束码表 <span class="jp">乗務終了メーター km</span></label>
          <input name="meterEnd" inputmode="decimal" value="${report.meterEnd || ''}">
          <p class="km">差引走行距離 <span id="dist">${dist || '—'}</span> km</p>
          <label>空车距离 <span class="jp">空車距離 km ※必須</span></label>
          <input name="emptyKm" inputmode="decimal" value="${report.emptyKm || ''}">
        </div>
        <div class="card">
          <h2>休息 / 睡眠</h2>
          ${[0,1,2].map((i) => {
            const x = report.rests[i] || Nikki.emptyRest();
            return `<label>地点 ${i+1}</label>
              <input name="restPlace-${i}" value="${x.place || ''}" placeholder="场所名">
              <div class="row2">
                <div><label>从</label>${timeSel('restFrom-'+i, x.from)}</div>
                <div><label>到</label>${timeSel('restTo-'+i, x.to)}</div>
              </div>`;
          }).join('')}
        </div>
        <div class="card">
          <h2>行程 主な経過地</h2>
          <p class="hint">先填这一趟，不够再点下面增加。最后一趟回库不用另写。</p>
          <div id="trips">${(report.trips || []).map(tripHtml).join('')}</div>
          <button class="add" type="button" id="addTrip">＋ 加一趟</button>
        </div>
        <div class="card">
          <h2>备注</h2>
          <label>事故 / 严重延误等 <span class="jp">異常な状況</span></label>
          <textarea name="accident">${report.accident || ''}</textarea>
          <label>运行指示变更 <span class="jp">運行指示書の変更</span></label>
          <textarea name="instruction">${report.instruction || ''}</textarea>
        </div>`;
      $btn.disabled = false;
      $btn.textContent = alreadySent() ? '更新提交' : '确认提交给公司';
      $btn.classList.toggle('ok', alreadySent());
      bind();
    }

    function readForm() {
      const g = (n) => {
        const el = $app.querySelector(`[name="${n}"]`);
        return el ? el.value : '';
      };
      report.date = g('date') || report.date;
      report.driverId = g('driverId') || report.driverId;
      report.vehicleId = g('vehicleId');
      report.startPlace = g('startPlace');
      report.startHour = g('startHour');
      report.startMin = g('startMin');
      report.endPlace = g('endPlace');
      report.endHour = g('endHour');
      report.endMin = g('endMin');
      report.meterStart = g('meterStart');
      report.meterEnd = g('meterEnd');
      report.emptyKm = g('emptyKm');
      report.accident = g('accident');
      report.instruction = g('instruction');
      report.rests = [0,1,2].map((i) => ({
        place: g('restPlace-' + i), from: g('restFrom-' + i), to: g('restTo-' + i),
      }));
      report.trips = [...$app.querySelectorAll('.trip')].map((el, i) => ({
        depart: g('depart-' + i),
        pickup: g('pickup-' + i),
        pax: g('pax-' + i),
        dropoff: g('dropoff-' + i),
        arrive: g('arrive-' + i),
        wait: g('wait-' + i),
      }));
      const dist = Nikki.distanceKm(report);
      const dEl = document.getElementById('dist');
      if (dEl) dEl.textContent = dist || '—';
    }

    function persist() {
      if (!report) return;
      readForm();
      Nikki.upsertReport(state, report);
      state = Nikki.load();
      const fresh = (state.reports || []).find((x) => x.id === report.id);
      if (fresh) report = fresh;
    }

    function bind() {
      $app.oninput = persist;
      $app.onchange = persist;
      const add = document.getElementById('addTrip');
      if (add) add.onclick = () => {
        persist();
        report.trips.push(Nikki.emptyTrip());
        Nikki.upsertReport(state, report);
        render();
      };
      $app.querySelectorAll('[data-del]').forEach((b) => {
        b.onclick = () => {
          persist();
          report.trips.splice(Number(b.dataset.del), 1);
          if (!report.trips.length) report.trips.push(Nikki.emptyTrip());
          Nikki.upsertReport(state, report);
          render();
        };
      });
    }

    $btn.onclick = () => {
      persist();
      if (!report.vehicleId) return toast('请选车辆番号');
      if (!report.emptyKm) return toast('空车距离必填');
      if (!report.startHour || !report.endHour) return toast('请填出库/回库时间');
      const wasSent = alreadySent();
      report.status = 'submitted';
      report.submittedAt = new Date().toISOString();
      Nikki.upsertReport(state, report, { who: Nikki.driverName(state, report.driverId), field: wasSent ? '更新' : '提交', from: '草稿', to: '已提交' });
      Nikki.flush();
      toast(wasSent ? '已更新，公司可以看到最新一版' : '已提交，还可以继续改、继续加行程');
      render();
    };

    (async () => {
      const sess = Nikki.restoreSession();
      state = await Nikki.boot();
      driverId = sess.driverId || sessionStorage.getItem('nikki-driver') || '';
      if (driverId && (sess.role === 'driver' || sessionStorage.getItem('nikki-role') === 'driver')) {
        report = Nikki.ensureToday(state, driverId);
        render();
      } else {
        driverId = '';
        renderLogin();
      }
    })();
  </script>
</body>
</html>
