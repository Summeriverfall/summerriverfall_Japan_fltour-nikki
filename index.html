<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>運転日報 · Fltour</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Sans+JP:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root { --gold:#C9A961; --cream:#FAF8F3; --card:#fff; --border:#E8E5DF; --dark:#2C2C2C; --light:#7A7A7A; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100dvh; background: var(--cream); color: var(--dark);
      font-family: 'Noto Sans SC','Noto Sans JP',sans-serif;
      display: flex; align-items: center; justify-content: center; padding: 1.5rem;
    }
    .box { max-width: 420px; width: 100%; }
    .brand { font-size: .75rem; letter-spacing: .18em; color: var(--gold); font-weight: 700; }
    h1 { font-size: 1.6rem; margin: .35rem 0 .25rem; }
    .jp { font-size: .95rem; letter-spacing: .28em; color: var(--light); font-weight: 500; margin-bottom: 1.4rem; }
    a.card {
      display: block; background: var(--card); border: 1px solid var(--border); border-radius: 16px;
      padding: 1.15rem 1.2rem; margin-bottom: .75rem; text-decoration: none; color: inherit;
    }
    a.card:hover { border-color: var(--gold); }
    a.card b { display: block; font-size: 1.05rem; margin-bottom: .25rem; }
    a.card span { font-size: .82rem; color: var(--light); line-height: 1.45; }
    .note { font-size: .78rem; color: var(--light); margin-top: 1rem; line-height: 1.55; }
  </style>
</head>
<body>
  <div class="box">
    <div class="brand">FLTOUR エフアイ</div>
    <h1>司机日报</h1>
    <p class="jp">運転日報 · 初版</p>
    <a class="card" href="driver.html">
      <b>司机端</b>
      <span>选自己的名字，填今天的出库/行程/码表，晚上点提交。提交后司机不能再改。</span>
    </a>
    <a class="card" href="admin.html">
      <b>管理端</b>
      <span>看已交日报、改内容、打印给陆运局。改痕只在后台「修改记录」，打印件上看不出来。</span>
    </a>
    <p class="note">初版数据存在这台电脑浏览器里，方便你点着看流程。王鵬车牌截图被挡住，管理端里标了待补。没有统计功能（对方说不需要）。</p>
  </div>
</body>
</html>
